[program:pandupos-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pandupos-enterprise/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/pandupos-enterprise
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/pandupos-enterprise/storage/logs/worker.log
stopwaitsecs=3600
