name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, gd, json, tokenizer, xml, zip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: ./vendor/bin/pint --test
      - run: npm ci
      - run: npm run build
      - name: Scan tracked files for committed secrets
        run: bash scripts/scan-secrets.sh
      - name: Run PHPUnit
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/pandupos-tests.log || {
            failure_summary="$(grep -Ei 'FAIL|FAILED|Error|Exception|SQLSTATE|Expected|Actual|Tests:|at tests/' /tmp/pandupos-tests.log | tail -n 60 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=PHPUnit failure summary::${failure_summary}"
            exit 1
          }
      - name: Audit Composer dependencies
        if: always()
        run: composer audit
